name: Windows Store MSIX
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; same as existing build
        with:
          persist-credentials: false
      - name: Compile Store app and validate MSIX
        run: python tools/build_msix.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7; same as existing build
        with:
          name: EdgeIsland-x64-STORE-MSIX
          path: |
            build/store/*.msix
            build/store/SHA256SUMS.txt
          if-no-files-found: error
