name: Windows unsigned build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile and package the x64 test build
        run: python tools/build.py
      - name: Inspect resources and compare embedded bytes
        run: python tools/verify.py --setup build/bin/EdgeIslandSetup.exe --payload-dir build/bin
      - name: Render the playback indicator and controls at three DPI scales
        run: python tests/render_windows.py
      - name: Exercise the native Windows installer and overlay
        shell: pwsh
        run: ./tests/Windows-Smoke.ps1 -Setup build/bin/EdgeIslandSetup.exe -PayloadDir build/bin
      - name: Create clearly marked test downloads
        run: python tools/bundle.py --setup build/bin/EdgeIslandSetup.exe --uninstaller build/bin/Uninstall.exe --out build/downloads
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: EdgeIsland-x64-UNSIGNED
          path: build/downloads/
          if-no-files-found: error
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check positioning, timers and performance math
        run: |
          cc -std=c11 -Wall -Wextra -Werror src/model.c tests/model_test.c -o "$RUNNER_TEMP/model_test"
          "$RUNNER_TEMP/model_test"
